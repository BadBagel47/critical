<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butik, förråd och varv: skiss</title>
<style>
/* A sketch of the shop, the stores and the shipyard (D-243), drawn with the game's own font and colours on a
   screen of the game's size. Everything in it is made up for the sketch: no game is running. */
:root {
  color-scheme: dark;
  --bg: #0b0c16;
  --panel: #14162a;
  --line: #2f3350;
  --text: #c9ccd8;
  --dim: #8a8ea6;
  --accent: #dba445;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 20px 16px 40px; }
main { max-width: 1300px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font: 600 1.6rem 'Trebuchet MS', 'Segoe UI', sans-serif; margin: 0; }
p { margin: 0; max-width: 90ch; }
.lede { color: var(--dim); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar span { color: var(--dim); margin-right: 4px; }
button { font: 600 .95rem 'Trebuchet MS', 'Segoe UI', sans-serif; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
button[aria-pressed='true'] { background: var(--accent); color: #15120a; border-color: var(--accent); }
canvas { width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; image-rendering: pixelated; border: 1px solid var(--line); background: #090911; }
.note { color: var(--dim); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Butik, förråd och varv</h1>
  <p class="lede">Skiss för D-243, inte byggd. Klicka i bilden: filterknapparna, sakerna i listan, platserna på varvet och knapparna i panelen. Piltangenterna flyttar markeringen och Enter gör det knappen säger. Alla siffror är påhittade för skissen.</p>
  <div class="bar" id="views"><span>Vy:</span></div>
  <div class="bar" id="players"><span>Du spelar som:</span></div>
  <canvas id="screen" width="1280" height="720" tabindex="0"></canvas>
  <p class="note" id="status"></p>
</main>
<script type="module">
import { BitmapFont } from '../../../src/font.js';
import { COL } from '../../../src/config.js';
import { rect } from '../../../src/render/draw.js';

const W = 640, H = 360;
const ROLES = ['captain', 'gunner', 'engineer'];
const NAME = { captain: 'CAPTAIN', gunner: 'GUNNER', engineer: 'ENGINEER', all: 'ALL' };
const ROLE_COL = { captain: COL.captain, gunner: COL.gunner, engineer: COL.engineer, all: COL.text };

// ---------- the things, as decided (R-1114, R-1125 to R-1148). Prices are made up. ----------
// kind: 'part' is installed at a shipyard, 'gear' is carried and works at once, 'service' is bought at the desk.
// levels: what each level gives, its price, and the number it moves.
const lv = (price, gives, stat) => ({ price, gives, stat });
const ITEMS = [
  { id: 'tank', role: 'captain', kind: 'part', slot: 'system', name: 'FUEL TANK', desc: 'ROOM FOR ONE MORE JUMP OF FUEL FOR EVERY LEVEL',
    levels: [1, 2, 3, 4, 5].map((k) => lv(120 + 40 * k, '+1 JUMP', ['JUMPS', k, k + 1])) },
  { id: 'boost', role: 'captain', kind: 'part', slot: 'system', name: 'AFTERBURNER', desc: 'HOLD SHIFT FOR SPEED  ·  BURNS FUEL FAST',
    levels: [lv(160, 'BOOST', ['TOP SPEED', 120, 190])] },
  { id: 'jumpcoil', role: 'captain', kind: 'part', slot: 'system', name: 'JUMP COILS', desc: 'JUMPS CHARGE FASTER AND COST LESS FUEL',
    levels: [lv(180, 'FASTER JUMPS', ['CHARGE', '8 S', '4 S'])] },
  { id: 'solar', role: 'captain', kind: 'part', slot: 'system', name: 'SOLAR CELLS', desc: 'SLOWLY FILL THE TANK FROM STARLIGHT',
    levels: [lv(200, 'ONE JUMP IN 5 MIN', ['FUEL PER MIN', 0, 5])] },
  { id: 'alarm', role: 'captain', kind: 'part', slot: 'system', name: 'ENEMY ALARM', desc: 'WARNS OF PIRATES FAR OUT',
    levels: [lv(120, 'ALARM', ['REACH', 0, 900]), lv(180, 'FURTHER', ['REACH', 900, 1400]), lv(240, 'ON THE SCREEN', ['WARNING', 'SOUND', 'SCREEN'])] },
  { id: 'tscan', role: 'captain', kind: 'part', slot: 'system', name: 'TARGET SCANNER', desc: 'SHOWS HEALTH AND BOARDING RISK',
    levels: [lv(140, 'HEALTH AND RISK', null)] },
  { id: 'tractor', role: 'captain', kind: 'part', slot: 'system', name: 'TRACTOR BEAM', desc: 'PULLS IN SALVAGE FROM A DISTANCE',
    levels: [lv(150, 'PULLS SALVAGE', ['REACH', 0, 180])] },
  { id: 'sysradar', role: 'captain', kind: 'part', slot: 'system', name: 'SYSTEM RADAR', desc: 'SHOWS WHO HOLDS THE SYSTEMS NEAR BY, AS THEY ARE NOW',
    levels: [lv(200, 'ONE JUMP', ['REACH', 0, 1]), lv(350, 'TWO JUMPS', ['REACH', 1, 2])] },
  { id: 'nose', role: 'gunner', kind: 'part', slot: 'hull', name: 'NOSE TURRET', desc: 'A PULSE TURRET THAT TURNS, IN THE NOSE',
    levels: [lv(140, 'TURRET', ['TURRETS', 0, 1])] },
  { id: 'twin', role: 'gunner', kind: 'part', slot: 'hull', name: 'TWIN WING TURRETS', desc: 'TWO MORE PULSE TURRETS',
    levels: [lv(150, 'TWO TURRETS', ['TURRETS', 1, 3])] },
  { id: 'heavy', role: 'gunner', kind: 'part', slot: 'hull', name: 'HEAVY LASER', desc: 'CHARGED BEAM, FIRES STRAIGHT AHEAD',
    levels: [lv(220, 'HEAVY LASER', ['DAMAGE PER SHOT', 6, 40])] },
  { id: 'rockets', role: 'gunner', kind: 'part', slot: 'hull', name: 'ROCKET PODS', desc: 'HOMING ROCKETS  ·  BUY THE ROCKETS AT THE DESK',
    levels: [lv(200, 'ROCKET PODS', ['ROCKETS', 0, 8])] },
  { id: 'bay', role: 'gunner', kind: 'part', slot: 'hull', name: 'FIGHTER BAY', desc: 'DARTS THAT FIGHT AT YOUR SIDE  ·  LAUNCHED BY HAND',
    levels: [1, 2, 3].map((k) => lv(220 + 60 * k, '+1 DART', ['DARTS', k - 1, k])) },
  { id: 'tcomp', role: 'gunner', kind: 'part', slot: 'system', name: 'TARGETING COMPUTER', desc: 'SHOWS THE GUNNER WHERE TO AIM',
    levels: [lv(130, 'AIM MARK', null)] },
  { id: 'armor', role: 'engineer', kind: 'part', slot: 'hull', name: 'ARMOR PLATING', desc: 'A STRONGER HULL',
    levels: [lv(160, 'HULL +80', ['HULL', 200, 280])] },
  { id: 'pd', role: 'engineer', kind: 'part', slot: 'hull', name: 'POINT DEFENSE', desc: 'SHOOTS DOWN SOME INCOMING FIRE',
    levels: [lv(220, 'POINT DEFENSE', ['SHOTS STOPPED', '0%', '25%'])] },
  { id: 'emit', role: 'engineer', kind: 'part', slot: 'system', name: 'SHIELD EMITTERS', desc: 'A STRONGER SHIELD',
    levels: [lv(180, 'SHIELD +50', ['SHIELD', 100, 150])] },
  { id: 'core', role: 'engineer', kind: 'part', slot: 'system', name: 'POWER CORE', desc: 'MORE POWER TO SHARE OUT',
    levels: [lv(240, 'POWER +2', ['POWER', 8, 10])] },
  { id: 'drones', role: 'engineer', kind: 'part', slot: 'system', name: 'REPAIR DRONES', desc: 'SLOWLY REPAIR THE SHIP ON THEIR OWN',
    levels: [lv(200, 'DRONES', ['HULL PER MIN', 0, 12])] },
  { id: 'dockfield', role: 'engineer', kind: 'part', slot: 'system', name: 'DOCKING FIELD', desc: 'A STRONGER EXTRA SHIELD WHILE DOCKED',
    levels: [lv(150, 'FIELD +50', ['DOCK SHIELD', 40, 90])] },
  { id: 'pulse', role: 'engineer', kind: 'part', slot: 'system', name: 'SCANNER PULSE', desc: 'SHOWS ALL OF THE SYSTEM FOR A MOMENT  ·  COSTS A LITTLE FUEL',
    levels: [lv(160, 'PULSE', null)] },
  ...ROLES.flatMap((role) => [
    { id: 'slotH-' + role, role, kind: 'slot', slot: 'hull', name: 'EXTRA HULL SLOT', desc: `ONE MORE HULL SLOT FOR THE ${NAME[role]}  ·  PERMANENT`,
      levels: [lv(250, '+1 SLOT', ['HULL SLOTS', 1, 2]), lv(375, '+1 SLOT', ['HULL SLOTS', 2, 3])] },
    { id: 'slotS-' + role, role, kind: 'slot', slot: 'system', name: 'EXTRA SYSTEM SLOT', desc: `ONE MORE SYSTEM SLOT FOR THE ${NAME[role]}  ·  PERMANENT`,
      levels: [lv(200, '+1 SLOT', ['SYSTEM SLOTS', 1, 2]), lv(300, '+1 SLOT', ['SYSTEM SLOTS', 2, 3])] },
  ]),
  { id: 'charge', role: 'gunner', kind: 'gear', slot: null, name: 'BREACHING CHARGE', desc: 'BLOWS A VAULT DOOR OPEN  ·  WAKES EVERYONE  ·  USED UP',
    levels: [lv(50, 'ONE CHARGE', ['CHARGES', 0, 1])] },
  { id: 'rifle', role: null, kind: 'gear', slot: null, name: 'RIFLE UPGRADE', desc: 'YOUR BOARDER HITS HARDER',
    levels: [lv(120, '+4 DAMAGE', ['DAMAGE', 10, 14]), lv(180, '+4 DAMAGE', ['DAMAGE', 14, 18])] },
  { id: 'suit', role: null, kind: 'gear', slot: null, name: 'SUIT ARMOR', desc: 'YOUR BOARDER TAKES MORE BEFORE THE TELEPORT',
    levels: [lv(160, '+50 HEALTH', ['HEALTH', 100, 150])] },
  { id: 'pack', role: null, kind: 'gear', slot: null, name: 'CARGO PACK', desc: 'CARRY TWO MORE THINGS PER TRIP',
    levels: [lv(140, '+2 CARRIED', ['CARRY', 3, 5])] },
  { id: 'tranq', role: null, kind: 'gear', slot: null, name: 'TRANQ GUN', desc: 'SILENT DARTS THAT PUT GUARDS TO SLEEP', levels: [lv(120, 'TRANQ GUN', null)] },
  { id: 'flare', role: null, kind: 'gear', slot: null, name: 'FLARES', desc: 'THROW A FLARE THAT LIGHTS A DARK ROOM', levels: [lv(60, 'FLARES', ['FLARES', 0, 3])] },
  { id: 'sentry', role: null, kind: 'gear', slot: null, name: 'DEPLOYABLE TURRET', desc: 'SET DOWN A SMALL TURRET', levels: [lv(180, 'TURRET', null)] },
  { id: 'hack', role: null, kind: 'gear', slot: null, name: 'HACKING KIT', desc: 'MORE TIME IN EVERY BREAK-IN', levels: [lv(150, 'MORE TIME', ['TIME', '100%', '140%'])] },
  { id: 'coils', role: null, kind: 'gear', slot: null, name: 'TELEPORTER COILS', desc: 'THE TELEPORTER RECHARGES FASTER', levels: [lv(150, 'FASTER', ['RECHARGE', '45 S', '25 S'])] },
];
const SERVICES = [
  { id: 'refuel', name: 'REFUEL', price: 75 },
  { id: 'repair', name: 'REPAIR', price: 17 },
  { id: 'rockets', name: 'ROCKETS', price: 32 },
  { id: 'probes', name: 'PROBES', price: 40 },
  { id: 'buoys', name: 'BUOYS', price: 60 },
  { id: 'chart', name: 'CHART', price: 100 },
  { id: 'ore', name: 'SELL ORE', price: -60 },
];

// What a thing is, for the second filter (R-1176).
for (const it of ITEMS) it.cat = it.kind === 'slot' ? 'slot' : it.kind === 'gear' ? 'boarding' : 'upgrade';
const CATS = { all: 'ALL', upgrade: 'UPGRADES', boarding: 'BOARDING', slot: 'SLOTS' };
// Every role can have three slots of each kind, one of them open from the start (a proposal, O2).
const MAX_SLOTS = 3;

// ---------- what the crew has, for the sketch ----------
const state = {
  view: 'shop',
  me: 'gunner',
  solo: false,
  filter: 'gunner',
  type: 'all',
  sel: 'bay',
  slotSel: null,
  scroll: 0,
  purses: { captain: 1860, gunner: 1630, engineer: 1820 },
  // How many levels of a thing are bought, and how many of them are installed. Gear is carried, and counts as
  // installed. A slot counts the slots bought beyond the first.
  own: {
    tank: { bought: 1, installed: 1 },
    alarm: { bought: 1, installed: 1 },
    twin: { bought: 1, installed: 1 },
    bay: { bought: 2, installed: 1 },
    armor: { bought: 1, installed: 0 },
    rifle: { bought: 1, installed: 1 },
    'slotS-captain': { bought: 1, installed: 1 },
    'slotH-gunner': { bought: 1, installed: 1 },
  },
  // The slots of every role: how many are open, and the part in each (R-1137, R-1174).
  slots: {
    captain: { hull: { open: 1, parts: [] }, system: { open: 2, parts: ['tank', 'alarm'] } },
    gunner: { hull: { open: 2, parts: ['twin', 'bay'] }, system: { open: 1, parts: [] } },
    engineer: { hull: { open: 1, parts: [] }, system: { open: 1, parts: [] } },
  },
  toast: '',
};
const me = () => (state.solo ? 'captain' : state.me);
const roleOf = (it) => it.role || me();
const mine = (it) => state.solo || !it.role || it.role === state.me;
const owned = (it) => state.own[it.id] || { bought: 0, installed: 0 };
const nextLv = (it) => it.levels[owned(it).bought] || null;
const item = (id) => ITEMS.find((x) => x.id === id);
const inSlot = (it) => !!it.role && !!it.slot && it.kind === 'part' && state.slots[it.role][it.slot].parts.includes(it.id);
// The slots of a kind a role has taken: by parts that are installed, and by parts in the stores (R-1173).
function slotsTaken(role, kind) {
  const s = state.slots[role][kind];
  const stored = ITEMS.filter((x) => x.kind === 'part' && x.role === role && x.slot === kind && owned(x).bought > 0 && !inSlot(x));
  return { taken: s.parts.length + stored.length, open: s.open };
}
// A part that would need a slot the role does not have free.
const noSlot = (it) => it.kind === 'part' && it.slot && owned(it).bought === 0 && (() => {
  const t = slotsTaken(it.role, it.slot);
  return t.taken >= t.open;
})();

// ---------- drawing ----------
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
let font;
const text = (t, x, y, c, o) => font.draw(ctx, t, x, y, c, o || {});
const width = (t) => font.width(t);
function wrap(t, w) {
  const out = [];
  let line = '';
  for (const word of t.split(' ')) {
    const next = line ? line + ' ' + word : word;
    if (width(next) > w && line) {
      out.push(line);
      line = word;
    } else line = next;
  }
  if (line) out.push(line);
  return out;
}

// The one placeholder icon every thing has for now: a crate with a part in it, and the colour of the role on
// its corner. `s` is its size in game pixels.
function icon(x, y, s, role) {
  const u = s / 16;
  const r = (a, b, w, h, c) => rect(ctx, x + a * u, y + b * u, w * u, h * u, c);
  r(1, 1, 14, 14, COL.out);
  r(2, 2, 12, 12, COL.steel[1]);
  r(3, 3, 10, 10, COL.steel[0]);
  r(2, 2, 12, 1, COL.steel[2]);
  r(2, 2, 1, 12, COL.steel[2]);
  r(6, 5, 4, 6, COL.steel[3]);
  r(5, 6, 6, 4, COL.steel[3]);
  r(7, 7, 2, 2, COL.steel[0]);
  r(7, 4, 2, 1, COL.steel[2]);
  r(7, 11, 2, 1, COL.steel[2]);
  r(4, 7, 1, 2, COL.steel[2]);
  r(11, 7, 1, 2, COL.steel[2]);
  r(12, 12, 2, 2, ROLE_COL[role] || COL.text);
}
// A small arrow, since the font has none: before and after (U4).
function arrow(x, y, c) {
  rect(ctx, x, y + 2.5, 6, 1, c);
  rect(ctx, x + 4, y + 1.5, 1, 3, c);
  rect(ctx, x + 5, y + 2, 1, 2, c);
}
// A slot as a small box: the colour of its role when something is in it, a frame when it is open and empty, and
// dark with a lock when it is not bought yet.
function slotBox(x, y, s, role, state3) {
  if (state3 === 'used') {
    rect(ctx, x, y, s, s, COL.steel[0], ROLE_COL[role]);
    rect(ctx, x + 2, y + 2, s - 4, s - 4, ROLE_COL[role]);
  } else if (state3 === 'open') rect(ctx, x, y, s, s, '#141420', ROLE_COL[role]);
  else {
    rect(ctx, x, y, s, s, '#0c0c14', COL.faint);
    const c = COL.faint;
    rect(ctx, x + s / 2 - 1.5, y + s / 2 - 2, 3, 1, c);
    rect(ctx, x + s / 2 - 1.5, y + s / 2 - 2, 0.5, 2, c);
    rect(ctx, x + s / 2 + 1, y + s / 2 - 2, 0.5, 2, c);
    rect(ctx, x + s / 2 - 2, y + s / 2, 4, 2.5, c);
  }
}
const slotState = (role, kind, i) => {
  const s = state.slots[role][kind];
  return i < s.parts.length ? 'used' : i < s.open ? 'open' : 'locked';
};
// One line per role: its hull slots and its system slots, as boxes.
function slotRow(x, y, role) {
  text(NAME[role], x, y + 1, ROLE_COL[role]);
  let cx = x + 58;
  for (const kind of ['hull', 'system']) {
    text(kind.toUpperCase(), cx, y + 1, COL.dim);
    cx += width(kind.toUpperCase()) + 4;
    for (let i = 0; i < MAX_SLOTS; i++) {
      slotBox(cx, y, 7, role, slotState(role, kind, i));
      cx += 9;
    }
    cx += 10;
  }
}

const P = { x: 16, y: 12, w: 608, h: 336 };
const LIST = { x: P.x + 12, y: P.y + 88, w: 378, rows: 4, tw: 122, th: 34 };
const SIDE = { x: P.x + 400, y: P.y + 48, w: P.w - 412, h: P.h - 62 };
let hits = [];
const hit = (x, y, w, h, act) => hits.push({ x, y, w, h, act });

function itemsShown() {
  let list = ITEMS;
  // What the crew has the most of that can be had is not offered (R-1175). Slots are not in the stores.
  if (state.view === 'shop') list = list.filter((it) => nextLv(it));
  else list = list.filter((it) => it.kind !== 'slot' && owned(it).bought > 0);
  if (state.filter !== 'all') list = list.filter((it) => (it.role ? it.role === state.filter : state.solo || state.filter === state.me));
  if (state.type !== 'all') list = list.filter((it) => it.cat === state.type);
  return list;
}

// What a thing says about itself in the list: its level and price, or where it is (R-1172).
function badge(it) {
  const o = owned(it);
  const n = it.levels.length;
  const lvl = n > 1 ? `LV ${o.bought}/${n}` : '';
  if (state.view === 'shop') {
    const next = nextLv(it);
    if (!mine(it)) return [(lvl ? lvl + '  ·  ' : '') + `${NAME[it.role]} BUYS`, COL.faint];
    if (noSlot(it)) return ['NO FREE SLOT', COL.ember[1]];
    const price = next.price + ' CR';
    return [lvl ? `${lvl}  ·  ${price}` : price, state.purses[roleOf(it)] >= next.price ? COL.ochre[2] : COL.ember[1]];
  }
  if (it.kind === 'gear') return [lvl ? `${lvl}  ·  CARRIED` : 'CARRIED', COL.engineer];
  if (!inSlot(it)) return ['IN STORES', COL.ochre[2]];
  if (o.installed < o.bought) return [`LV ${o.installed}/${n} · ${o.bought - o.installed} STORED`, COL.ochre[2]];
  return [lvl ? `${lvl}  ·  INSTALLED` : 'INSTALLED', COL.engineer];
}

function drawList() {
  const list = itemsShown();
  const per = 3;
  const first = state.scroll * per;
  list.slice(first, first + LIST.rows * per).forEach((it, i) => {
    const x = LIST.x + (i % per) * (LIST.tw + 6);
    const y = LIST.y + Math.floor(i / per) * (LIST.th + 4);
    const sel = it.id === state.sel;
    rect(ctx, x, y, LIST.tw, LIST.th, sel ? '#1c2140' : '#141420', sel ? COL.ion[2] : COL.line);
    rect(ctx, x, y, 2, LIST.th, ROLE_COL[it.role] || COL.steel[2]);
    icon(x + 5, y + 5, 24, it.role);
    const dim = state.view === 'shop' && (!mine(it) || noSlot(it));
    const name = wrap(it.name, LIST.tw - 36);
    text(name[0], x + 33, y + 6, dim ? COL.dim : COL.text);
    if (name[1]) text(name[1], x + 33, y + 15, dim ? COL.dim : COL.text);
    const [b, c] = badge(it);
    text(b, x + 33, y + (name[1] ? 25 : 20), c);
    hit(x, y, LIST.tw, LIST.th, () => (state.sel = it.id));
  });
  const rows = Math.ceil(list.length / per);
  if (!list.length) text(state.view === 'shop' ? 'NOTHING MORE TO BUY HERE' : 'NOTHING BOUGHT HERE YET', LIST.x + 4, LIST.y + 6, COL.faint);
  if (rows > LIST.rows) {
    const more = `${state.scroll + 1} / ${rows - LIST.rows + 1}  ·  SCROLL FOR MORE`;
    text(more, LIST.x + LIST.w, LIST.y + LIST.rows * (LIST.th + 4) + 1, COL.dim, { align: 'r' });
  }
}

function filterRow(y, opts, now, label, color, pick) {
  let x = LIST.x;
  for (const f of opts) {
    const t = label(f);
    const w = width(t) + 16;
    const on = now === f;
    rect(ctx, x, y, w, 15, on ? '#20243f' : '#141420', on ? color(f) : COL.line);
    text(t, x + 8, y + 4, on ? color(f) : COL.dim);
    hit(x, y, w, 15, () => {
      pick(f);
      state.scroll = 0;
    });
    x += w + 4;
  }
}
function drawFilters() {
  // Whose things (R-1123), and what they are (R-1176).
  filterRow(P.y + 48, ['all', ...ROLES], state.filter, (f) => (f === state.me && !state.solo ? NAME[f] + '  (YOU)' : NAME[f]),
    (f) => ROLE_COL[f], (f) => (state.filter = f));
  const cats = state.view === 'shop' ? Object.keys(CATS) : ['all', 'upgrade', 'boarding'];
  filterRow(P.y + 67, cats, state.type, (f) => CATS[f], () => COL.ion[2], (f) => (state.type = f));
}

function drawServices() {
  const y = P.y + P.h - 58;
  rect(ctx, LIST.x, y - 6, LIST.w, 1, COL.line);
  text('ANYONE CAN BUY  ·  PAID FROM YOUR OWN PURSE', LIST.x, y, COL.engineer);
  let x = LIST.x;
  let row = 0;
  for (const s of SERVICES) {
    const label = s.price < 0 ? `${s.name} +${-s.price}` : `${s.name} ${s.price}`;
    const w = width(label) + 10;
    if (x + w > LIST.x + LIST.w) {
      x = LIST.x;
      row++;
    }
    const by = y + 10 + row * 17;
    rect(ctx, x, by, w, 14, '#141420', COL.line);
    text(label, x + 5, by + 3, s.price < 0 ? COL.acid[2] : COL.ochre[2]);
    hit(x, by, w, 14, () => {
      state.purses[me()] -= s.price;
      state.toast = `${s.name}  ·  ${s.price < 0 ? 'EVERY ROLE GETS ' + -s.price : 'PAID BY THE ' + NAME[me()]} CR`;
    });
    x += w + 4;
  }
}

let reason = null;
function button(x, y, w, label, color, act, why) {
  rect(ctx, x, y, w, 18, act ? '#20243f' : '#141420', act ? color : COL.line);
  text(label, x + w / 2, y + 5, act ? color : COL.faint, { align: 'c' });
  if (act) hit(x, y, w, 18, act);
  // Why it cannot be done, said once, above the buttons.
  else if (why && !reason) reason = why;
}

// The levels of a thing, what each gives, and the next one before and after (R-1128).
function levels(it, x, y) {
  const o = owned(it);
  text(`LEVELS  ${o.bought}/${it.levels.length}`, x, y, COL.dim);
  y += 11;
  it.levels.forEach((l, k) => {
    const have = k < o.bought;
    const inst = it.kind !== 'part' || (inSlot(it) && k < o.installed);
    rect(ctx, x, y - 2, SIDE.w - 16, 11, k === o.bought ? '#1c2140' : null);
    text(['I', 'II', 'III', 'IV', 'V'][k], x + 2, y, have ? COL.engineer : COL.dim);
    text(l.gives, x + 22, y, have ? COL.text : COL.dim);
    const right = have ? (inst ? 'OWNED' : 'IN STORES') : l.price + ' CR';
    text(right, x + SIDE.w - 18, y, have && inst ? COL.engineer : COL.ochre[2], { align: 'r' });
    y += 11;
  });
  const next = nextLv(it);
  if (next && next.stat) {
    y += 4;
    const [what, a, b] = next.stat;
    const left = `${what}  ${a}  `;
    text(left, x, y, COL.ion[2]);
    arrow(x + width(left), y, COL.ion[2]);
    text(`  ${b}`, x + width(left) + 6, y, COL.ion[2]);
    y += 12;
  }
  return y;
}

function drawSideItem() {
  const it = item(state.sel) || itemsShown()[0];
  if (!it) return;
  state.sel = it.id;
  const x = SIDE.x + 8;
  let y = SIDE.y + 8;
  icon(x, y, 40, it.role);
  const title = wrap(it.name, SIDE.w - 60);
  title.forEach((t, i) => text(t, x + 46, y + 2 + i * 10, COL.text));
  text(it.role ? NAME[it.role] : 'WHOEVER BUYS IT', x + 46, y + 4 + title.length * 10, ROLE_COL[it.role] || COL.dim);
  const where = { gear: 'CARRIED  ·  WORKS AT ONCE', slot: 'PERMANENT  ·  NEEDS NO SLOT' }[it.kind] || `TAKES A ${it.slot.toUpperCase()} SLOT`;
  text(where, x + 46, y + 14 + title.length * 10, COL.dim);
  y += 50;
  for (const line of wrap(it.desc, SIDE.w - 16)) {
    text(line, x, y, COL.text);
    y += 10;
  }
  y = levels(it, x, y + 4);
  if (it.role && it.slot) {
    y += 2;
    slotRow(x, y, it.role);
  }
  const by = SIDE.y + SIDE.h - 26;
  const bw = (SIDE.w - 20) / 2;
  const o = owned(it);
  const role = roleOf(it);
  const next = nextLv(it);
  if (state.view === 'shop') {
    const why = !mine(it) ? `THE ${NAME[it.role]} BUYS THIS` : noSlot(it) ? 'NO FREE SLOT  ·  BUY AN EXTRA SLOT' : state.purses[role] < next.price ? 'NOT ENOUGH CREDITS' : null;
    button(x, by, bw, `BUY  ${next.price} CR`, COL.ochre[2], why ? null : () => {
      state.purses[role] -= next.price;
      if (it.kind === 'slot') {
        state.slots[it.role][it.slot].open++;
        state.own[it.id] = { bought: o.bought + 1, installed: o.installed + 1 };
        state.toast = `${it.name}  ·  OPEN NOW`;
      } else {
        state.own[it.id] = { bought: o.bought + 1, installed: it.kind === 'gear' ? o.installed + 1 : o.installed };
        state.toast = it.kind === 'gear' ? `${it.name}  ·  CARRIED, IT WORKS AT ONCE` : `${it.name}  ·  IN THE STORES, INSTALL IT AT A SHIPYARD`;
      }
    }, why);
    const back = o.bought ? Math.floor(it.levels[o.bought - 1].price / 2) : 0;
    const stored = it.kind === 'part' && (!inSlot(it) || o.installed < o.bought);
    const sellWhy = !o.bought ? null : it.kind === 'slot' ? 'SLOTS ARE PERMANENT' : !mine(it) ? `THE ${NAME[it.role]} SELLS THIS` : it.kind === 'part' && !stored ? 'REMOVE IT AT A SHIPYARD FIRST' : null;
    button(x + bw + 4, by, bw, o.bought && it.kind !== 'slot' ? `SELL  +${back} CR` : 'SELL', COL.acid[2], o.bought && !sellWhy ? () => {
      state.purses[role] += back;
      const left = o.bought - 1;
      state.own[it.id] = { bought: left, installed: Math.min(o.installed, left) };
      if (!left && inSlot(it)) state.slots[it.role][it.slot].parts = state.slots[it.role][it.slot].parts.filter((p) => p !== it.id);
      state.toast = `${it.name}  ·  SOLD FOR HALF  ·  +${back} CR`;
    } : null, sellWhy);
  } else {
    text('INSTALL AND REMOVE AT A SHIPYARD', x, by - 6, COL.dim);
    text('BUY AND SELL AT A SHOP', x, by + 5, COL.dim);
  }
}

// ---------- the shipyard: the ship with its slots (O1) ----------
const SHIP = { x: LIST.x + 8, y: LIST.y + 4, w: LIST.w - 16 };
function slotPlaces() {
  // Hull slots outside the hull, above it; system slots inside it. Each role has its own group.
  const out = [];
  ROLES.forEach((role, r) => {
    for (let i = 0; i < MAX_SLOTS; i++) {
      out.push({ role, kind: 'hull', i, x: SHIP.x + 20 + r * 116 + i * 28, y: SHIP.y + 18 });
      out.push({ role, kind: 'system', i, x: SHIP.x + 20 + r * 116 + i * 28, y: SHIP.y + 92 });
    }
  });
  return out;
}
function drawShipSlots() {
  const top = SHIP.y + 60;
  // The frigate, drawn simply: a hull with wings.
  ctx.fillStyle = '#1b1d2c';
  ctx.beginPath();
  ctx.moveTo(SHIP.x + SHIP.w / 2, top - 6);
  ctx.lineTo(SHIP.x + SHIP.w - 6, top + 22);
  ctx.lineTo(SHIP.x + SHIP.w - 30, top + 82);
  ctx.lineTo(SHIP.x + 30, top + 82);
  ctx.lineTo(SHIP.x + 6, top + 22);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = COL.steel[1];
  ctx.lineWidth = 1;
  ctx.stroke();
  text('HULL SLOTS  ·  OUTSIDE', SHIP.x, SHIP.y + 4, COL.dim);
  text('SYSTEM SLOTS  ·  INSIDE', SHIP.x + 24, SHIP.y + 80, COL.dim);
  for (const p of slotPlaces()) {
    const st = slotState(p.role, p.kind, p.i);
    const sel = state.slotSel && state.slotSel.role === p.role && state.slotSel.kind === p.kind && state.slotSel.i === p.i;
    if (sel) rect(ctx, p.x - 3, p.y - 3, 28, 28, null, COL.ion[2]);
    slotBox(p.x, p.y, 22, p.role, st);
    if (st === 'used') icon(p.x + 3, p.y + 3, 16, p.role);
    hit(p.x - 3, p.y - 3, 28, 28, () => (state.slotSel = { role: p.role, kind: p.kind, i: p.i }));
  }
  ROLES.forEach((role, r) => text(NAME[role], SHIP.x + 20 + r * 116, SHIP.y + 124, ROLE_COL[role]));
  text('CLICK A SLOT', SHIP.x + SHIP.w, SHIP.y + 124, COL.faint, { align: 'r' });
  // What lies in the stores, waiting to be installed.
  const waiting = ITEMS.filter((it) => it.kind === 'part' && owned(it).bought > 0 && (!inSlot(it) || owned(it).installed < owned(it).bought));
  const y = P.y + P.h - 58;
  rect(ctx, LIST.x, y - 6, LIST.w, 1, COL.line);
  text('IN THE STORES, WAITING', LIST.x, y, COL.dim);
  let x = LIST.x;
  for (const it of waiting) {
    const t = it.name + (inSlot(it) ? '  LV ' + (owned(it).installed + 1) : '');
    text(t, x, y + 12, ROLE_COL[it.role]);
    x += width(t) + 12;
  }
}
function drawSideSlot() {
  if (!state.slotSel) state.slotSel = { role: me(), kind: 'hull', i: 0 };
  const { role, kind, i } = state.slotSel;
  const s = state.slots[role][kind];
  const st = slotState(role, kind, i);
  const x = SIDE.x + 8;
  let y = SIDE.y + 8;
  text(`${NAME[role]}  ${kind.toUpperCase()} SLOT ${i + 1}`, x, y, ROLE_COL[role]);
  y += 14;
  const by = SIDE.y + SIDE.h - 26;
  const bw = (SIDE.w - 20) / 2;
  const can = state.solo || role === state.me;
  if (st === 'locked') {
    text('LOCKED', x, y, COL.dim);
    for (const line of wrap('BUY AN EXTRA SLOT IN A SHOP TO OPEN IT. A SLOT STAYS ONCE IT IS BOUGHT.', SIDE.w - 16)) {
      y += 11;
      text(line, x, y, COL.dim);
    }
    return;
  }
  if (st === 'open') {
    text('EMPTY', x, y, COL.dim);
    y += 16;
    const fits = ITEMS.filter((it) => it.kind === 'part' && it.role === role && it.slot === kind && owned(it).bought > 0 && !inSlot(it));
    text(fits.length ? 'IN THE STORES, FITS HERE' : 'NOTHING IN THE STORES FITS HERE', x, y, COL.dim);
    y += 12;
    for (const it of fits) {
      button(x, y, SIDE.w - 16, 'INSTALL  ' + it.name, COL.engineer, can ? () => {
        s.parts.push(it.id);
        state.own[it.id] = { ...owned(it), installed: 1 };
        state.toast = `${it.name}  ·  INSTALLED  ·  FREE`;
      } : null, can ? null : `ONLY THE ${NAME[role]} INSTALLS HERE`);
      y += 22;
    }
    if (reason) text(reason, x, y + 2, COL.ember[2]);
    return;
  }
  const it = item(s.parts[i]);
  const o = owned(it);
  icon(x, y, 32, role);
  text(it.name, x + 38, y + 4, COL.text);
  text(it.levels.length > 1 ? `LV ${o.installed}/${it.levels.length} INSTALLED` : 'INSTALLED', x + 38, y + 15, COL.engineer);
  y = levels(it, x, y + 40);
  const why = !can ? `ONLY THE ${NAME[role]} INSTALLS AND REMOVES THIS` : null;
  button(x, by, bw, 'NEXT LEVEL', COL.engineer, !why && o.installed < o.bought ? () => {
    state.own[it.id] = { ...o, installed: o.installed + 1 };
    state.toast = `${it.name}  ·  LEVEL ${o.installed + 1} INSTALLED  ·  FREE`;
  } : null, why || (o.installed >= o.bought ? 'NO HIGHER LEVEL IN THE STORES' : null));
  button(x + bw + 4, by, bw, 'REMOVE', COL.ochre[2], why ? null : () => {
    s.parts = s.parts.filter((p) => p !== it.id);
    state.own[it.id] = { ...o, installed: 0 };
    state.toast = `${it.name}  ·  BACK IN THE STORES`;
  }, why);
  if (reason) text(reason, x, by - 12, COL.ember[2]);
}

function drawPurses() {
  const big = state.solo ? 'YOUR PURSES' : `${NAME[me()]}  ${state.purses[me()]} CR`;
  text(big, P.x + P.w - 12, P.y + 12, state.solo ? COL.text : ROLE_COL[me()], { align: 'r' });
  const rest = ROLES.filter((r) => state.solo || r !== me()).map((r) => `${NAME[r]} ${state.purses[r]}`).join('   ');
  text(rest, P.x + P.w - 12, P.y + 25, COL.dim, { align: 'r' });
}

function draw() {
  hits = [];
  reason = null;
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.fillStyle = '#0d0d18';
  ctx.fillRect(0, 0, W, H);
  // The station floor behind it, as in the game.
  for (let gx = 0; gx < W; gx += 16) for (let gy = 0; gy < H; gy += 16) rect(ctx, gx, gy, 15, 15, (gx + gy) % 32 ? '#161724' : '#141522');
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  rect(ctx, P.x, P.y, P.w, P.h, COL.panel, COL.steel[1]);
  rect(ctx, P.x + 3, P.y + 3, P.w - 6, P.h - 6, null, COL.line);
  const place = { shop: 'KESTREL YARD', stores: 'THE STORES', yard: 'KESTREL YARD' }[state.view];
  text(place, P.x + 12, P.y + 12, COL.text, { scale: 2 });
  const sub = {
    shop: 'SHOP  ·  FRIENDLY STATION  ·  BUY AND SELL',
    stores: 'WHAT THE CREW OWNS  ·  EVERYONE SEES IT  ·  I OPENS IT ON BOARD',
    yard: 'SHIPYARD  ·  INSTALLING IS FREE  ·  NO BUYING OR SELLING',
  }[state.view];
  text(sub, P.x + 12, P.y + 32, COL.dim);
  drawPurses();
  rect(ctx, SIDE.x, SIDE.y, SIDE.w, SIDE.h, '#11131f', COL.line);
  if (state.view === 'yard') {
    drawShipSlots();
    drawSideSlot();
  } else {
    drawFilters();
    drawList();
    if (state.view === 'shop') drawServices();
    else {
      // The slots of every role, at the foot of the list (R-1137).
      const y = P.y + P.h - 58;
      rect(ctx, LIST.x, y - 6, LIST.w, 1, COL.line);
      text('SLOTS  ·  EACH ROLE HAS ITS OWN, AND THEY STAY', LIST.x, y, COL.dim);
      ROLES.forEach((r, k) => slotRow(LIST.x, y + 11 + k * 11, r));
    }
    drawSideItem();
    if (reason) text(reason, SIDE.x + 8, SIDE.y + SIDE.h - 38, COL.ember[2]);
  }
  text('ARROWS  MOVE    ENTER  BUY    F  CLOSE', P.x + P.w - 12, P.y + P.h - 9, COL.faint, { align: 'r' });
  if (state.toast) {
    const w = width(state.toast) + 16;
    rect(ctx, W / 2 - w / 2, P.y + P.h + 1, w, 11, COL.out, COL.engineer);
    text(state.toast, W / 2, P.y + P.h + 3, COL.engineer, { align: 'c' });
  }
  document.getElementById('status').textContent = state.solo
    ? 'Ensam: alla roller är dina, och alla avdelningar är öppna för köp.'
    : `Du spelar som ${NAME[state.me].toLowerCase()}. Butiken visar allt, men du köper bara det som hör till din roll.`;
}

// ---------- input ----------
canvas.addEventListener('click', (e) => {
  const b = canvas.getBoundingClientRect();
  const mx = ((e.clientX - b.left) / b.width) * W;
  const my = ((e.clientY - b.top) / b.height) * H;
  const h = hits.find((x) => mx >= x.x && mx < x.x + x.w && my >= x.y && my < x.y + x.h);
  if (h) {
    state.toast = '';
    h.act();
    draw();
  }
  canvas.focus();
});
canvas.addEventListener('wheel', (e) => {
  const rows = Math.ceil(itemsShown().length / 3);
  state.scroll = Math.max(0, Math.min(rows - LIST.rows, state.scroll + Math.sign(e.deltaY)));
  e.preventDefault();
  draw();
}, { passive: false });
canvas.addEventListener('keydown', (e) => {
  const list = itemsShown();
  let i = Math.max(0, list.findIndex((x) => x.id === state.sel));
  const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 3, ArrowUp: -3 }[e.key];
  if (step) {
    i = Math.max(0, Math.min(list.length - 1, i + step));
    state.sel = list[i].id;
    const row = Math.floor(i / 3);
    if (row < state.scroll) state.scroll = row;
    if (row >= state.scroll + LIST.rows) state.scroll = row - LIST.rows + 1;
    e.preventDefault();
    draw();
  }
});

const views = document.getElementById('views');
for (const [v, label] of Object.entries({ shop: 'Butik', stores: 'Förråd', yard: 'Varv' })) {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = () => {
    state.view = v;
    state.scroll = 0;
    state.slotSel = null;
    state.toast = '';
    for (const x of views.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
    draw();
  };
  b.setAttribute('aria-pressed', String(v === state.view));
  views.append(b);
}
const players = document.getElementById('players');
for (const [who, label] of Object.entries({ captain: 'Captain', gunner: 'Gunner', engineer: 'Engineer', solo: 'Ensam' })) {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = () => {
    state.solo = who === 'solo';
    state.me = state.solo ? 'captain' : who;
    state.filter = state.solo ? 'all' : who;
    state.scroll = 0;
    state.slotSel = null;
    state.toast = '';
    for (const x of players.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
    draw();
  };
  b.setAttribute('aria-pressed', String(who === state.me));
  players.append(b);
}

const img = new Image();
img.src = '../../../assets/font.png';
const meta = await fetch('../../../assets/font.json').then((r) => r.json());
await img.decode();
font = new BitmapFont(img, meta);
window.__shop = { state, draw };
draw();
</script>
